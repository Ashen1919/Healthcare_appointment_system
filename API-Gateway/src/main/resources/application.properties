spring.application.name=API-Gateway
server.port=8080
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_AUTH_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

doctor.service.url=${DOCTOR_SERVICE_URL}
patient.service.url=${PATIENT_SERVICE_URL}
appointment.service.url=${APPOINTMENT_SERVICE_URL}
