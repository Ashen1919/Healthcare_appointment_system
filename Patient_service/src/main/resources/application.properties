spring.application.name=Patient_service
server.port=8083
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_PAT_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
appointment.service.url=${APPOINTMENT_SERVICE_URL}
doctor.service.url=${DOCTOR_SERVICE_URL}